<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kawal Sehat: informasi dan layanan kesehatan yang menyesuaikan diri dengan penggunanya, dari anak-anak sampai lansia." />
    <meta name="theme-color" content="#1f6f4a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>Kawal Sehat</title>
    <script>
      // Pasang preferensi tampilan sebelum halaman digambar supaya tidak berkedip.
      ;(function () {
        var p = {}
        try {
          p = JSON.parse(localStorage.getItem('ks-prefs') || '{}') || {}
        } catch (e) {}
        var h = document.documentElement
        h.dataset.profil = p.profil || 'dewasa'
        h.dataset.teks = p.teks || 'normal'
        if (p.kontras) h.dataset.kontras = 'ya'
        if (p.sederhana) h.dataset.sederhana = 'ya'
        if (p.gerak) h.dataset.gerak = 'kurang'
        if (p.isyarat) h.dataset.isyarat = 'ya'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
